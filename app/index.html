        <table style="margin-top:4px;font-size:10.5px"><tr><td></td><td class="n">Tirs</td><td class="n">Cadrés</td><td class="n">Non cadrés</td><td class="n">Contrés</td><td class="n">Surface</td><td class="n">Hors surf.</td></tr>
        ${[["us","Pau"],["them","Adv."]].map(([tm,l]) => { const f = finitionStats(m, tm); return `<tr><td><b>${l}</b></td><td class="n">${f.total}</td><td class="n">${f.onTarget}</td><td class="n">${f.res.horscadre}</td><td class="n">${f.res.contre}</td><td class="n">${f.surf}</td><td class="n">${f.hors}</td></tr>`; }).join("")}</table></div>
        <div class="ent" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="box"><h4>Entrées 20 m Pau · ${entryCounts(m,"us").total}</h4>${entriesSVG(entryCounts(m,"us"), "#f6c400", "us", false, true)}</div><div class="box"><h4>Entrées 20 m adv. · ${entryCounts(m,"them").total}</h4>${entriesSVG(entryCounts(m,"them"), opp, "them", false, true)}</div></div></div>
      <div class="col"><div class="box"><h4>Récupérations Pau · ${zoneCounts(m,"recup").total}</h4>${zoneGridSVG(zoneCounts(m,"recup"), "#f6c400", {print:true})}</div>
        <div class="box"><h4>Pertes Pau · ${zoneCounts(m,"perte").total}</h4>${zoneGridSVG(zoneCounts(m,"perte"), opp, {print:true})}</div>
        ${m.shots.length ? `<div class="box"><h4>xG cumulés</h4>${xgChartSVG(m, true)}</div>` : ""}</div>
    </div>${foot}</div>`;
}
function openPdfPreview(){
  const m = current();
  const bg = modal(`<h3>PDF une page</h3><p class="hint">Aperçu du rapport ${state.view === "indiv" ? "individuel" : "collectif"} au format A4 paysage.</p>
    <div class="preview-box"><div class="rpt-scale" id="rpt-holder">${reportHTML(m)}</div></div>
    <div class="actions"><button class="btn" data-x="no">Fermer</button><button class="btn primary" data-x="dl">Télécharger le PDF</button></div>`, "wide");
  const holder = bg.querySelector("#rpt-holder"), box = bg.querySelector(".preview-box");
  const fit = () => { const s = Math.min(1, (box.clientWidth - 20)/1123); holder.style.transform = `scale(${s})`; holder.style.height = (794*s) + "px"; holder.style.width = (1123*s) + "px"; };
  fit(); window.addEventListener("resize", fit, {once:true});
  bg.querySelector('[data-x="no"]').onclick = () => bg.remove();
  bg.querySelector('[data-x="dl"]').onclick = async (e) => {
    const btn = e.currentTarget; btn.disabled = true; btn.textContent = "Génération…";
    try {
      const blob = await buildPdf(m);
      const name = state.view === "indiv" ? `${slug(state.player)}-${slug(m.opponent||"match")}.pdf` : `pau-fc-${slug(m.opponent||"match")}${m.date ? "-" + m.date : ""}.pdf`;
      if (await saveFile(name, blob)) toast("PDF prêt.");
    } catch (err){ toast("Le PDF n'a pas pu être généré : " + (err.message || "erreur")); }
    btn.disabled = false; btn.textContent = "Télécharger le PDF";
  };
}
async function buildPdf(m){
  await Promise.all([loadScript(LIB.h2c), loadScript(LIB.jspdf)]);
  const host = document.createElement("div");
  host.style.cssText = "position:fixed;left:-20000px;top:0;width:1123px;height:794px;";
  host.innerHTML = reportHTML(m);
  // Couleurs fixes pour l'impression : les variables de thème sont résolues en clair
  host.style.setProperty("--pitch","#f6faf6"); host.style.setProperty("--pitch-line","#b9c6bb"); host.style.setProperty("--pitch-stripe","#eef4ee");
  host.style.setProperty("--ink","#0d1a3a"); host.style.setProperty("--ink-2","#56618a"); host.style.setProperty("--focus","#2b62e3"); host.style.setProperty("--pau","#f6c400");
  document.body.appendChild(host);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await window.html2canvas(host.firstElementChild, {scale:2, backgroundColor:"#ffffff", useCORS:true, logging:false});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({orientation:"landscape", unit:"mm", format:"a4", compress:true});
    pdf.addImage(canvas.toDataURL("image/jpeg", .92), "JPEG", 0, 0, 297, 210);
    pdf.setProperties({title: m.title, creator:"ANALYSE-DATA"});
    return pdf.output("blob");
  } finally { host.remove(); }
}

        const r = done(mm, "tir modifié"); r.xg = +xgOf(s).toFixed(2); return r; }},
    {name:"supprimer_tir", description:"Supprime un tir (id fourni par lire_match).", inputSchema:{type:"object", properties:{id:{type:"string"}}, required:["id"]},
      execute: ({id}) => { const mm = m(); const n = mm.shots.length; mm.shots = mm.shots.filter(s => s.id !== id); return n === mm.shots.length ? {erreur:"Tir introuvable"} : done(mm, "tir supprimé"); }},
    {name:"ajouter_actions", description:"Ajoute des actions saisies à la main : récupérations ou pertes de Pau dans une zone, ou entrées dans les 20 m par couloir.",
      inputSchema:{type:"object", properties:{type:{type:"string", enum:["recuperation","perte","entree20m"]}, nombre:{type:"integer", minimum:1, maximum:30}, zone:{type:"string", description:"Z1 à Z18 (récupération/perte), facultatif si x/y donnés"}, x:{type:"number", description:"position exacte, 0-105 dans le sens du jeu de Pau"}, y:{type:"number", description:"0-68, 0 = gauche de Pau"}, equipe:{type:"string", enum:["pau","adv"], description:"pour entree20m"}, couloir:{type:"string", enum:["gauche","axe","droite"], description:"pour entree20m"}}, required:["type"]},
      execute: (a) => { const mm = m(); const n = clamp(Math.round(+a.nombre || 1),1,30);
        for (let i=0;i<n;i++){
          if (a.type === "entree20m") mm.events.push({id:uid(), n:"20M (saisie)", k:"20M", tm:team(a.equipe), t:0, e:0, c: a.couloir === "gauche" ? "G" : a.couloir === "droite" ? "D" : "A", man:1});
          else { const hasXY = Number.isFinite(+a.x) && Number.isFinite(+a.y) && a.x != null && a.y != null; const z = hasXY ? zoneFromXY(clamp(+a.x,0,L), clamp(+a.y,0,W)) : /^Z(1[0-8]|[1-9])$/i.test(a.zone||"") ? a.zone.toUpperCase() : null; if (!z) return {erreur:"Zone invalide (Z1 à Z18) ou x/y manquants"}; const k = a.type === "perte" ? "PERTE" : "RECUP"; const ev = {id:uid(), n:k + " (saisie)", k, tm:"us", t:0, e:0, z, man:1}; if (hasXY) placeEvent(ev, clamp(+a.x,0,L), clamp(+a.y,0,W)); mm.events.push(ev); }
        }
        return done(mm, `${n} action(s) ajoutée(s)`); }},
    {name:"retirer_actions", description:"Retire des actions saisies (priorité aux saisies manuelles) : récupérations/pertes dans une zone, ou entrées 20 m d'un couloir.",
      inputSchema:{type:"object", properties:{type:{type:"string", enum:["recuperation","perte","entree20m"]}, nombre:{type:"integer", minimum:1}, zone:{type:"string"}, equipe:{type:"string", enum:["pau","adv"]}, couloir:{type:"string", enum:["gauche","axe","droite"]}}, required:["type"]},
      execute: (a) => { const mm = m(); let n = clamp(Math.round(+a.nombre || 1),1,200), removed = 0;
        const match = e => a.type === "entree20m" ? (e.k === "20M" && e.tm === team(a.equipe) && e.c === (a.couloir === "gauche" ? "G" : a.couloir === "droite" ? "D" : "A")) : (e.k === (a.type === "perte" ? "PERTE" : "RECUP") && e.tm === "us" && e.z === String(a.zone||"").toUpperCase());
        for (const manualFirst of [true, false]) for (let i = mm.events.length-1; i >= 0 && removed < n; i--){ const e = mm.events[i]; if (match(e) && (!manualFirst || e.man)){ mm.events.splice(i,1); removed++; } }
        return removed ? done(mm, `${removed} action(s) retirée(s)`) : {erreur:"Aucune action correspondante"}; }},
    {name:"definir_statistique", description:"Ajoute ou met à jour une ligne du comparatif Pau / adversaire (ex. « Passes réussies (%) »). supprimer=true pour la retirer.",
      inputSchema:{type:"object", properties:{libelle:{type:"string"}, pau:{type:"number"}, adversaire:{type:"number"}, supprimer:{type:"boolean"}}, required:["libelle"]},
      execute: (a) => { const mm = m(); const i = mm.stats.findIndex(s => norm(s.label) === norm(a.libelle));
        if (a.supprimer){ if (i < 0) return {erreur:"Statistique introuvable"}; mm.stats.splice(i,1); return done(mm, "statistique retirée"); }
        const row = {label:a.libelle, us:+a.pau || 0, them:+a.adversaire || 0}; if (i >= 0) mm.stats[i] = row; else mm.stats.push(row); return done(mm, "statistique enregistrée"); }},
    {name:"afficher", description:"Change la vue du dashboard : collectif, indiv (avec un joueur) ou stockage.", inputSchema:{type:"object", properties:{vue:{type:"string", enum:["collectif","indiv","docs"]}, joueur:{type:"string"}}, required:["vue"]},
      execute: (a) => { state.view = oneOf(a.vue, ["collectif","indiv","docs"], "collectif"); if (a.joueur){ const p = playerList(current()).find(x => norm(x).includes(norm(a.joueur))); if (p) state.player = p; } render(); return {ok:true}; }}
  ];
}
function mdLite(t){
  const lines = esc(t).split("\n"); let html = "", inList = false;
  for (const raw of lines){
    const l = raw.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    const li = l.match(/^\s*[-*•]\s+(.*)$/);
    if (li){ if (!inList){ html += "<ul>"; inList = true; } html += `<li>${li[1]}</li>`; continue; }
    if (inList){ html += "</ul>"; inList = false; }
    html += l.trim() ? `<p style="margin:0 0 6px">${l.replace(/^#+\s*/,"")}</p>` : "";
  }
  return html + (inList ? "</ul>" : "");
}
function renderAI(){
  let root = $("#ai"); if (!root){ root = document.createElement("div"); root.id = "ai"; document.body.appendChild(root); }
  if (!AI.sample){ root.innerHTML = ""; return; }
  if (!AI.open){ root.innerHTML = `<button class="ai-fab" data-ai="open" aria-label="Ouvrir l'assistant Claude">Demander à Claude</button>`; return; }
  if (AI.sample.native && (!AI.key || !AI.key.set || AI.keyEdit)){
    root.innerHTML = `<aside class="ai-panel" aria-label="Assistant Claude"><div class="ai-head"><div><strong>Assistant Claude</strong><small>application de bureau</small></div><div class="toolbar"><button class="btn sm ghost-dark" data-ai="close">Fermer</button></div></div>
      <div class="ai-msgs"><div class="ai-msg bot">Dans l'application de bureau, Claude passe par une <strong>clé API Anthropic</strong> (facturée à l'usage, séparément de ton abonnement Claude). Crée-la sur console.anthropic.com › API Keys, puis colle-la ici. Elle reste sur ton ordinateur.</div>
      ${AI.keyErr ? `<div class="ai-msg err">${esc(AI.keyErr)}</div>` : ""}</div>
      <form class="ai-form" id="ai-key-form"><input class="f" id="ai-key" type="password" placeholder="sk-ant-…" autocomplete="off" aria-label="Clé API Anthropic" style="flex:1">
        <button type="submit" class="btn primary">Enregistrer</button>${AI.key && AI.key.set ? `<button type="button" class="btn" data-ai="key-cancel">Annuler</button>` : ""}</form></aside>`;
    return;
  }
  const m = current();
  const sugg = ["Résume ce match en 5 points clés pour le staff","Quels sont nos axes d'amélioration à partir des pertes et des tirs concédés ?","Change la couleur de l'adversaire en bleu","Ajoute un tir de la tête de notre n°9 à 6 m dans l'axe, cadré, à la 63e"];
  const draft = $("#ai-input") ? $("#ai-input").value : "";
  root.innerHTML = `<aside class="ai-panel" aria-label="Assistant Claude">
    <div class="ai-head"><div><strong>Assistant Claude</strong><small>${esc(m.title)}</small></div><div class="toolbar">${AI.sample.native ? `<button class="btn sm ghost-dark" data-ai="key" title="${esc(AI.key && AI.key.hint || "")}">Clé API</button>` : ""}${AI.msgs.length ? `<button class="btn sm ghost-dark" data-ai="clear">Effacer</button>` : ""}<button class="btn sm ghost-dark" data-ai="close" aria-label="Fermer">Fermer</button></div></div>
    <div class="ai-msgs" id="ai-msgs">
      ${AI.msgs.length ? "" : `<div class="ai-msg bot">Je peux analyser ce match et le modifier pour toi : infos et couleurs, score, tirs (avec le xG recalculé), récupérations et pertes par zone, entrées dans les 20 m, statistiques du comparatif. ${AI.sample.native ? "Chaque demande est facturée sur ta clé API Anthropic." : "Chaque demande utilise ton compte Claude."}</div><div class="ai-sugg">${sugg.map(s => `<button data-ai="sugg">${esc(s)}</button>`).join("")}</div>`}
      ${AI.msgs.map(x => x.role === "user" ? `<div class="ai-msg user">${esc(x.content)}</div>` : x.role === "err" ? `<div class="ai-msg err">${esc(x.content)}</div>` : x.role === "tool" ? `<div class="ai-msg tool">✓ ${esc(x.content)}</div>` : `<div class="ai-msg bot">${x.content ? mdLite(x.content) : "Réflexion…"}</div>`).join("")}
    </div>
    <form class="ai-form" id="ai-form"><textarea id="ai-input" rows="2" placeholder="Ex. : passe le score à 2-1 et résume la 2e mi-temps" aria-label="Message pour Claude">${esc(draft)}</textarea>
      ${AI.busy ? `<button type="button" class="btn" data-ai="stop">Arrêter</button>` : `<button type="submit" class="btn primary">Envoyer</button>`}</form></aside>`;
  const box = $("#ai-msgs"); box.scrollTop = box.scrollHeight;
}
async function aiSend(text){
  text = String(text||"").trim(); if (!text || AI.busy) return;
  AI.msgs.push({role:"user", content:text});
  const bot = {role:"assistant", content:""}; AI.msgs.push(bot);
  AI.busy = true; AI.ctrl = new AbortController(); AI.log = [];
  const inp = $("#ai-input"); if (inp) inp.value = "";
  renderAI();
  // Historique court : les 10 derniers échanges, consignes dans le premier message
  const hist = AI.msgs.filter(x => (x.role === "user" || x.role === "assistant") && (x.content || x === bot)).filter(x => x !== bot).slice(-10);
  while (hist.length && hist[0].role !== "user") hist.shift();
  const input = hist.map((x,i) => ({role:x.role, content: i === 0 ? AI_RULES + "\n\nDemande de Lucas : " + x.content : x.content}));
  try {
    const res = await AI.sample(input, {tools: aiTools(), signal: AI.ctrl.signal, modelTier:"default",
      onText: ({text}) => { bot.content = text; const last = document.querySelector("#ai-msgs .ai-msg.bot:last-child"); if (last) { last.innerHTML = mdLite(text); const b = $("#ai-msgs"); b.scrollTop = b.scrollHeight; } else renderAI(); }});
    bot.content = res.text || bot.content || "C'est fait.";
  } catch (e){
    bot.content = (e && e.text) || "";
    if (!bot.content) AI.msgs.pop();
    if (e && (e.code === "no_key" || e.code === "bad_key")){ AI.key = {set:false}; AI.keyErr = e.code === "bad_key" ? "Cette clé API est refusée par Anthropic. Vérifie-la ou crées-en une nouvelle." : ""; }
    const msg = e && e.code === "bad_key" ? "Clé API refusée par Anthropic : enregistre une clé valide." : e && e.code === "no_key" ? "Enregistre d'abord ta clé API." : e && e.code === "refusal" ? "Claude a refusé cette demande." : e && e.code === "network" ? "Pas de connexion à Claude : vérifie internet." : e && e.code === "not_granted" ? "Tu as refusé l'accès à Claude pour cette page. Recharge la page pour qu'il te soit redemandé." : e && e.code === "rate_limited" ? "Trop de demandes d'un coup. Réessaie dans une minute." : e && e.code === "cancelled" ? "Demande arrêtée." : "Claude n'a pas pu répondre : " + (e && e.message || "erreur inconnue");
    AI.msgs.push({role:"err", content:msg});
  }
  AI.log.forEach(l => AI.msgs.splice(AI.msgs.lastIndexOf(bot), 0, {role:"tool", content:l}));
  AI.busy = false; AI.ctrl = null; renderAI();
}
document.addEventListener("click", (evt) => {
  const b = evt.target.closest("[data-ai]"); if (!b) return;
  const a = b.dataset.ai;
  if (a === "open"){ AI.open = true; renderAI(); const i = $("#ai-input"); if (i) i.focus(); }
  else if (a === "close"){ AI.open = false; renderAI(); }
  else if (a === "clear"){ AI.msgs = []; renderAI(); }
  else if (a === "key"){ AI.keyEdit = true; AI.keyErr = ""; renderAI(); }
  else if (a === "key-cancel"){ AI.keyEdit = false; renderAI(); }
  else if (a === "stop"){ if (AI.ctrl) AI.ctrl.abort(); }
  else if (a === "sugg") aiSend(b.textContent);
});
document.addEventListener("submit", async (evt) => {
  if (evt.target.id !== "ai-key-form") return; evt.preventDefault();
  const k = $("#ai-key").value.trim();
  try { await AI.sample.setKey(k); AI.key = await AI.sample.keyStatus(); AI.keyEdit = false; AI.keyErr = ""; toast("Clé API enregistrée sur cet ordinateur."); }
  catch (e){ AI.keyErr = (e && e.message) || "Clé non enregistrée."; }
  renderAI();
});
document.addEventListener("submit", (evt) => { if (evt.target.id === "ai-form"){ evt.preventDefault(); aiSend($("#ai-input").value); } });
document.addEventListener("keydown", (evt) => { if (evt.target.id === "ai-input" && evt.key === "Enter" && !evt.shiftKey){ evt.preventDefault(); aiSend(evt.target.value); } });

initStorage();
})();
</script>
