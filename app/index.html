<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/icon.png">
<script src="/shim.js"></script>
</head>
<body>
<title>ANALYSE-DATA</title>
<!-- Pau FC Analyse : repère conservé pour la mise à jour automatique de l'appli bureau -->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* Layout: barre de match bleu nuit en tête, puis une grille de panneaux "feuille de match" ; terrains dessinés en SVG à l'échelle 105 × 68 m. */
:root{
  --bg:#eef1f7; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#0d1a3a; --ink-2:#56618a; --line:#d9deea;
  --navy:#0a1f4f; --navy-2:#132d6b; --on-navy:#f3f5fb;
  --pau:#f6c400; --pau-deep:#c99f00; --pau-ink:#0a1f4f;
  --pitch:#e6efe6; --pitch-line:#9db59f; --pitch-stripe:#dde8dd;
  --good:#1d8a52; --bad:#c2352b; --focus:#2b62e3;
  --f-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#081230; --surface:#0f1c42; --surface-2:#13234f; --ink:#e7ebf7; --ink-2:#9aa5c8; --line:#22336a;
  --navy:#050d24; --navy-2:#0f1c42; --on-navy:#f3f5fb;
  --pau:#ffcf1a; --pau-deep:#ffd84d; --pau-ink:#ffcf1a;
  --pitch:#12301f; --pitch-line:#3f7357; --pitch-stripe:#153624;
  --good:#3fc27e; --bad:#ff6b5e; --focus:#7aa2ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081230; --surface:#0f1c42; --surface-2:#13234f; --ink:#e7ebf7; --ink-2:#9aa5c8; --line:#22336a;
  --navy:#050d24; --navy-2:#0f1c42; --on-navy:#f3f5fb;
  --pau:#ffcf1a; --pau-deep:#ffd84d; --pau-ink:#ffcf1a;
  --pitch:#12301f; --pitch-line:#3f7357; --pitch-stripe:#153624;
  --good:#3fc27e; --bad:#ff6b5e; --focus:#7aa2ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* Barre haute */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy);border-bottom:3px solid var(--pau)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;letter-spacing:.04em;font-size:20px;text-transform:uppercase}
.crest{width:34px;height:34px;border-radius:7px;background:var(--pau);color:#0a1f4f;display:grid;place-items:center;font-size:13px;font-weight:800;overflow:hidden;flex:none}
.crest img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.12em;opacity:.7}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;color:var(--on-navy);padding:6px 16px;border-radius:999px;cursor:pointer;font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.tabs button[aria-selected="true"]{background:var(--pau);color:#0a1f4f}
.top .spacer{flex:1}
.top select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 10px;color:var(--on-navy);max-width:280px}
.top select option{color:#0d1a3a;background:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--pau);color:#0a1f4f;border-color:var(--pau)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost-dark{background:transparent;color:var(--on-navy);border-color:rgba(255,255,255,.3)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Bandeau match */
.match-head{background:linear-gradient(180deg,var(--navy) 0,var(--navy-2) 100%);color:var(--on-navy);padding-block:18px 22px}
.match-head .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.team{display:flex;align-items:center;gap:12px;min-width:0}
.team.away{justify-content:flex-end;text-align:right}
.team .badge{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;flex:none;overflow:hidden;border:2px solid rgba(255,255,255,.25)}
.team .badge img{width:100%;height:100%;object-fit:contain;background:#fff}
.team .name{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,3vw,32px);text-transform:uppercase;letter-spacing:.02em;line-height:1;overflow-wrap:anywhere}
.team .meta{font-size:12px;opacity:.75;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.score{text-align:center}
.score .big{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,6vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.score .big span{opacity:.5;padding:0 6px}
.score .xg{font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-top:4px}
.score .when{font-size:12px;opacity:.65;margin-top:6px}
@media (max-width:640px){.match-head .wrap{grid-template-columns:1fr 1fr}.match-head .score{grid-column:1/-1;order:-1}.team .badge{width:40px;height:40px;font-size:14px}.team .name{font-size:20px}.two .pitch-svg{max-width:340px;margin:0 auto}}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}

.sample-note{background:var(--surface);border:1px dashed var(--pau-deep);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
.sample-note strong{color:var(--ink)}

main{padding-block:18px 84px;display:grid;gap:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
.panel .ph{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.panel .sub{color:var(--ink-2);font-size:13px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media (max-width:1040px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.hint{font-size:13px;color:var(--ink-2)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:14px;color:var(--ink-2);font-size:14px;text-align:center}

/* Barres de comparaison */
.duels{display:grid;gap:9px}
.duel{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:10px}
.duel .v{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.duel .v.r{text-align:right}
.duel .v.lead{color:var(--ink)}
.duel .v.trail{color:var(--ink-2);font-weight:600}
.duel .mid{display:grid;gap:4px}
.duel .lbl{text-align:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}
.duel .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);gap:2px}
.duel .bar i{display:block;height:100%}
.duel .bar .us{background:var(--pau)}
.duel .bar .them{background:var(--opp)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2);align-items:center}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.sw.us{background:var(--pau)}.sw.them{background:var(--opp)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.kpi .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-2)}

/* Terrain */
.pitch-svg{width:100%;height:auto;display:block;max-width:100%;touch-action:manipulation}
.pitch-svg text{font-family:var(--f-display);font-weight:700}
.pitch-wrap{position:relative}
.pitch-svg.editing{cursor:crosshair}
.pitch-svg.editing .zpt{cursor:pointer}
.fin-bars{display:grid;gap:6px;margin-top:8px}
.fin-row{display:grid;grid-template-columns:150px 1fr 28px 44px;align-items:center;gap:8px;font-size:13px}
.fin-row .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}.fin-row .bar i{display:block;height:100%}
.fin-row b{text-align:right;font-variant-numeric:tabular-nums}.fin-row small{color:var(--ink-2);text-align:right}
.ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.ind-grid{grid-template-columns:1fr}}
.pitch-svg .zone{cursor:default}
.pitch-svg.editing .zone,.pitch-svg.editing .lane{cursor:pointer}
.pitch-svg.editing .zone:hover rect,.pitch-svg.editing .lane:hover rect{stroke:var(--focus);stroke-width:.6}
.pitch-svg .shot{cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px 32px}
.half-map{max-width:440px;margin:0 auto}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.editor{display:grid;gap:10px;background:var(--surface-2);border-radius:8px;padding:12px;margin-top:12px}
.editor .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.editor label.l{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600;min-width:120px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;width:30px;height:30px;cursor:pointer;font-weight:700}
.stepper span{min-width:28px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:17px}
input[type=text],input[type=number],input[type=date],select.f{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
input[type=number]{width:80px}
.xg-live{font-family:var(--f-display);font-weight:800;font-size:22px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t td.n{text-align:right;font-family:var(--f-display);font-weight:700;font-size:16px}
.tscroll{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.pill.us{background:var(--pau);color:#0a1f4f}
.pill.them{background:var(--opp);color:var(--opp-ink)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.minibar{height:8px;border-radius:4px;background:var(--pau);min-width:2px}
details.model{font-size:14px;color:var(--ink-2);margin-top:10px}
details.model summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.model code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:13px}

/* Indiv */
.players{display:flex;flex-wrap:wrap;gap:6px}
.players button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:14px}
.players button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.pcard{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo{width:84px;height:84px;border-radius:12px;background:var(--surface-2);border:2px solid var(--pau);display:grid;place-items:center;overflow:hidden;font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--ink-2);flex:none}
.photo img{width:100%;height:100%;object-fit:cover}
.pname{font-family:var(--f-display);font-weight:800;font-size:30px;text-transform:uppercase;line-height:1}
.notes{display:grid;gap:6px;max-height:260px;overflow:auto}
.note{display:flex;gap:8px;align-items:flex-start;font-size:14px}

/* Stockage */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--ink-2);background:var(--surface)}
.drop.over{border-color:var(--pau-deep);background:var(--surface-2)}
.doclist{display:grid;gap:8px}
.doc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.doc .ext{width:46px;height:46px;border-radius:8px;background:var(--navy);color:var(--pau);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px;text-transform:uppercase}
.doc .nm{font-weight:600;overflow-wrap:anywhere}
.doc .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media (max-width:600px){.doc{grid-template-columns:auto 1fr}.doc .acts{grid-column:1/-1;justify-content:flex-start}}

/* Modale */
.modal-bg{position:fixed;inset:0;background:rgba(5,12,32,.55);z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;max-width:640px;width:100%;max-height:100%;overflow:auto;padding:20px;display:grid;gap:14px;border-top:4px solid var(--pau)}
.modal.wide{max-width:1200px}
.modal h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase}
.form{display:grid;grid-template-columns:150px 1fr;gap:10px 12px;align-items:center}
.form label{font-size:13px;font-weight:600;color:var(--ink-2)}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swatches button{width:26px;height:26px;border-radius:6px;border:2px solid var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.modal .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on-navy);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.preview-box{overflow:auto;background:var(--surface-2);border-radius:8px;padding:10px}
.preview-box .rpt-scale{transform-origin:top left}
@media (prefers-reduced-motion:no-preference){.duel .bar i{transition:width .4s ease}}

/* Codage en direct */
.cw-bar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.cw-clock{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;min-width:150px}
.cw-clock small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.cw-clock.run{color:var(--good)}
.cw-ctx{display:flex;flex-wrap:wrap;gap:6px}
.cw-stage{overflow-x:auto;background:#3a3a3a;border-radius:var(--r);padding:8px}
.cw-inner{position:relative;transform-origin:top left}
.cw-b{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font:600 10px/1.1 Helvetica,Arial,sans-serif;border-radius:3px;padding:2px;overflow:hidden;user-select:none}
.cw-b.tiny{font-size:7px;padding:0;letter-spacing:-.02em}
.cw-b.txt{font-weight:700;font-size:11px;color:#111;pointer-events:none}
.cw-b.code,.cw-b.lab{cursor:pointer;border-style:solid;border-width:1px;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.cw-b.code:active,.cw-b.lab:active{transform:translateY(1px)}
.cw-b .hk{position:absolute;right:2px;bottom:1px;font-size:8px;opacity:.85}
.cw-b.on{outline:3px solid #33e07a;outline-offset:-3px;animation:none}
.cw-b.tgt{outline:3px solid #2b62e3;outline-offset:-3px}
.cw-b.flash{filter:brightness(1.6)}
@media (prefers-reduced-motion:no-preference){.cw-b.flash{transition:filter .4s}}
.cw-b.on::after{content:"●";position:absolute;left:3px;top:1px;color:#33e07a;font-size:9px}
.cw-b.fol{outline:3px solid var(--pau);outline-offset:1px;box-shadow:0 0 0 6px rgba(246,196,0,.25)!important}
/* Style appli des fenêtres de codage (positions et structure d'origine conservées) */
.cw-stage.app{background:radial-gradient(120% 90% at 15% 0,#173375 0,#0a1f4f 55%,#061431 100%);border:1px solid rgba(255,255,255,.08)}
.cw-stage.app .cw-b{border-radius:7px;font:600 10.5px/1.1 var(--f-body)}
.cw-stage.app .cw-b.tiny{font-size:7.5px}
.cw-stage.app .cw-b.code,.cw-stage.app .cw-b.lab{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 5px rgba(0,0,0,.4);transition:filter .1s}
.cw-stage.app .cw-b.code{font:700 11.5px/1.05 var(--f-display);letter-spacing:.02em;text-transform:uppercase;border-width:1px 1px 1px 4px}
.cw-stage.app .cw-b.code.tiny{font-size:8px}
.cw-stage.app .cw-b.code:hover,.cw-stage.app .cw-b.lab:hover{filter:brightness(1.1)}
.cw-stage.app .cw-b.txt{background:transparent!important;color:#f3f5fb!important;font:800 12px/1 var(--f-display);letter-spacing:.08em;white-space:nowrap;text-transform:uppercase;justify-content:flex-start;padding-left:8px;border-left:3px solid var(--pau);border-radius:2px}
.cw-stage.app .cw-b.txt.zone{border:1px dashed rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.035)!important}
.cw-stage.app .cw-b.txt.pitch{border:1px solid rgba(255,255,255,.25);background:linear-gradient(90deg,transparent calc(50% - .5px),rgba(255,255,255,.25) calc(50% - .5px),rgba(255,255,255,.25) calc(50% + .5px),transparent calc(50% + .5px)),repeating-linear-gradient(90deg,rgba(40,120,70,.35) 0 12.5%,rgba(40,120,70,.22) 12.5% 25%)!important}
.cw-stage.app .cw-b .hk{background:rgba(0,0,0,.4);color:#fff;border-radius:4px;padding:0 3px;font:600 8px/1.3 var(--f-body);opacity:1;right:2px;bottom:2px}
.cw-stage.app .cw-b.on{outline-offset:1px;box-shadow:0 0 0 5px rgba(51,224,122,.3)!important}
.cw-stage.app .cw-b.tgt{outline-offset:1px}
.cw-jumps{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow:auto}

    if (!c){ if (t === "GAUCHE") c = "G"; else if (t === "DROITE") c = "D"; else if (t === "AXE" || t === "CENTRE" || t === "AXIAL") c = "A"; }

    if (!r){ if (t.includes("POSITI")) r = "pos"; else if (t.includes("AMELIOR")) r = "ame"; else if (t.includes("INTENTION")) r = "int"; }
  }
  return {z,c,b,r};
}
function canon(rawName, teamHint){
  const n = String(rawName||"").trim().toUpperCase().replace(/\s+/g," ");
  if (MAP[n]) return {k:MAP[n][0], tm: teamHint || MAP[n][1]};
  // Codes de la fenêtre Sportscode : "03 - TIR", "*03 - TIR ADV"
  const cw = n.match(/^(\*)?\s*\d{1,2}\s*-\s*(.+)$/);
  if (cw){
    let base = cw[2].trim(), adv = !!cw[1];
    if (/\sADV$/.test(base)){ adv = true; base = base.replace(/\s+ADV$/,""); }
    const hit = CW_MAP[base];
    return {k: hit ? hit[0] : base, tm: teamHint || (hit && hit[1]) || (adv ? "them" : "us")};
  }
  const stripped = n.replace(/^\*/,"");
  if (n.startsWith("*") && MAP[stripped]) return {k:MAP[stripped][0], tm: teamHint || "them"};
  let m = n.match(/^(.*?)\s+(OFF|DEF|ADV|CONTRE|POUR)$/);
  if (m){ const base = m[1]; const tm = (m[2]==="OFF"||m[2]==="POUR") ? "us" : "them"; const k = MAP[base] ? MAP[base][0] : base; return {k, tm: teamHint || tm}; }
  // Libellés libres (exports Excel) : on cherche un mot-clé connu
  const nn = norm(n);
  const guess = [["tir","TIR"],["shot","TIR"],["frappe","TIR"],["but","BUT"],["goal","BUT"],["centre","CENTRE"],["cross","CENTRE"],["20m","20M"],["20 m","20M"],["surface","20M"],["recup","RECUP"],["perte","PERTE"],["corner","CORNER"],["touche","TOUCHE"],["faute","FAUTE"],["hors-jeu","HJ"],["hors jeu","HJ"],["transition","TRANSITION"]];
  for (const [w,k] of guess) if (nn.includes(w)) return {k, tm: teamHint || (n.startsWith("*") ? "them" : "us")};
  return {k: stripped, tm: teamHint || (n.startsWith("*") ? "them" : "us")};
}
function isPlayerLike(name){
  const n = String(name||"").trim().toUpperCase().replace(/\s+/g," ");
  if (!n || TACTICAL.has(n) || TACTICAL.has(n.replace(/^\*/,""))) return false;
  if (/^\*?\s*\d{1,2}\s*-\s/.test(n) || /^(KICK OFF|UPDATE|COACH)$/.test(n)) return false;
  if (/\b(OFF|DEF|ADV)$/.test(n)) return false;
  if (/^\d{1,2}$/.test(n)) return true;
  return /[A-ZÀ-Ÿ].*\s+[A-ZÀ-Ÿ]/.test(n) && !/^(BLOC|JEU|SORTIE|RESSORTIE|COUP|CPA)\b/.test(n);
}

   Lecture des fichiers
   ========================================================= */
function guessTeams(title){
  const t = String(title||"").replace(/^\s*[A-Z]?\d+\s*[-–:]\s*/i,"");
  const m = t.match(/^(.+?)\s+(?:v|vs|-|–|contre)\.?\s+(.+)$/i);
  if (!m) return {opponent:"", venue:"dom"};
  const a = m[1].trim(), b = m[2].trim();
  if (/pau/i.test(b) && !/pau/i.test(a)) return {opponent:a, venue:"ext"};
  return {opponent:b, venue:"dom"};
}
function fieldOf(node, name){
  if (!node) return "";
  const lname = name.toLowerCase();
  for (const a of node.attributes || []) if (a.name.toLowerCase() === lname) return a.value;
  for (const ch of node.children || []) if (ch.tagName.toLowerCase() === lname) return ch.textContent;
  return "";
}
function parseXML(text, fileName){
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("Le fichier XML est mal formé.");
  const root = doc.documentElement;
  const rname = root.tagName.toLowerCase();
  const events = [];
  let title = fileName.replace(/\.[^.]+$/,"");
  if (rname === "all_instances" || doc.querySelector("ALL_INSTANCES, instance")){
    // Hudl Sportscode
    for (const inst of doc.querySelectorAll("instance")){
      const code = fieldOf(inst,"code");
      const labs = [...inst.querySelectorAll("label")].map(l => ({g: fieldOf(l,"group").trim(), t: fieldOf(l,"text").trim()})).filter(x => x.t);
      const start = parseTime(fieldOf(inst,"start")), end = parseTime(fieldOf(inst,"end"));
      events.push({raw:code, start, end, remark:labs.filter(x => !/^(COMPETITION|JOURNEE|LIEU|EQUIPE|ADV|Halftime|QT|Minute)$/i.test(x.g)).map(x => x.t).join(";"), l:labs, type:code.startsWith("*") ? "Defending" : "Attacking", players:[]});
    }
  } else {
    // LongoMatch / Nacsport : on ignore les doublons de <playlist>
    title = fieldOf(root,"title") || title;
    let acts = [...doc.querySelectorAll("actions > action")];
    if (!acts.length) acts = [...doc.querySelectorAll("action")].filter(a => !a.closest("playlist"));
    for (const a of acts){
      const players = [...a.querySelectorAll("players > player")].map(p => p.children.length ? fieldOf(p,"name") : p.textContent.trim()).filter(Boolean);
      const labels = [...a.querySelectorAll("labels > label")].map(l => l.textContent.trim()).join(";");
      events.push({raw: fieldOf(a,"actionName") || fieldOf(a,"name"), type: fieldOf(a,"actionType") || fieldOf(a,"type") || "Other",
        start: parseTime(fieldOf(a,"startTime")), end: parseTime(fieldOf(a,"endTime")), remark: [fieldOf(a,"remark"), labels].filter(Boolean).join(";"), players});
    }
  }
  if (!events.length) throw new Error("Aucune action trouvée dans ce XML (formats reconnus : LongoMatch, Nacsport, Sportscode).");
  return buildFromTimeline(events, title, fileName, rname === "all_instances" ? "Sportscode" : "LongoMatch/Nacsport");
}
function buildFromTimeline(raw, title, fileName, format){
  const playerSet = new Set();
  for (const e of raw){
    if (e.type === "Other" && isPlayerLike(e.raw)) playerSet.add(e.raw.trim());
    else if (format !== "Sportscode" && isPlayerLike(e.raw) && !MAP[e.raw.toUpperCase()]) playerSet.add(e.raw.trim());
    e.players.forEach(p => playerSet.add(p));
  }
  const playerTags = new Set([...playerSet].map(p => p.toUpperCase()));
  const events = [];
  for (const e of raw){
    const tags = extractTags(e.remark);
    const isP = playerTags.has(String(e.raw).trim().toUpperCase());
    if (isP){
      events.push({id:uid(), pl:e.raw.trim(), t:e.start, e:e.end, r:tags.r, rm:String(e.remark||"").slice(0,200)});
      continue;
    }
    let {k, tm} = canon(e.raw);
    if (k === "PENALTY" && e.type === "Defending") tm = "them";
    const ev = {id:uid(), n:String(e.raw).trim(), k, tm, t:e.start, e:e.end};
    if (tags.z) ev.z = tags.z; if (tags.c) ev.c = tags.c; if (tags.b) ev.b = tags.b;
    if (e.players.length) ev.p = e.players;
    if (e.l && e.l.length) ev.l = e.l;
    events.push(ev);
  }
  const g = guessTeams(title);
  return newMatch({title, opponent:g.opponent, venue:g.venue, events, players:[...playerSet].sort((a,b)=>a.localeCompare(b,"fr")), source:{name:fileName, format}});
}

const ALIASES = {
  action:["action","evenement","event","code","nom action","type action","categorie","libelle","action name"],
  team:["equipe","team","camp","club"],
  x:["x","pos x","position x","x debut","start x","x1","coord x","location x"],
  y:["y","pos y","position y","y debut","start y","y1","coord y","location y"],
  zone:["zone"],
  corridor:["couloir","corridor","lane"],
  player:["joueur","player","nom joueur","tireur","nom"],
  minute:["minute","min","temps","time","chrono","t"],
  body:["corps","surface","surface de contact","partie du corps","body","body part","contact"],
  opp:["adversaires","nb adversaires","adversaires entre","defenseurs","opponents","nb def","pression"],
  result:["resultat","issue","outcome","result"],
  situation:["situation","phase","type tir","contexte"]
};
function findCols(header){
  const h = header.map(c => norm(c));
  const out = {};
  for (const [key, list] of Object.entries(ALIASES)){
    let idx = h.findIndex(c => list.includes(c));
    if (idx < 0) idx = h.findIndex(c => c && list.some(a => a.length > 2 && c.startsWith(a)));
    if (idx >= 0) out[key] = idx;
  }
  return out;
}
function parseRows(sheets, fileName){
  const events = [], shots = [], stats = [], perPlayer = {}; const players = new Set();
  let title = fileName.replace(/\.[^.]+$/,""), oppName = "";
  for (const {name:sheetName, rows} of sheets){
    const clean = rows.filter(r => r && r.some(c => String(c).trim() !== ""));
    if (clean.length < 2) continue;
    let hi = clean.findIndex(r => r.filter(c => typeof c === "string" && c.trim() && isNaN(Number(String(c).replace(",", ".")))).length >= 2);
    if (hi < 0 || hi > 10) hi = 0;
    const header = clean[hi].map(c => String(c));
    const body = clean.slice(hi+1);
    const cols = findCols(header);
    const num = v => { const n = Number(String(v).replace(",", ".").replace("%","")); return Number.isFinite(n) ? n : null; };
    if (cols.action != null){
      const xs = [], ys = [];
      body.forEach(r => { if (cols.x!=null && num(r[cols.x])!=null) xs.push(num(r[cols.x])); if (cols.y!=null && num(r[cols.y])!=null) ys.push(num(r[cols.y])); });
      const mx = Math.max(0,...xs), my = Math.max(0,...ys);
      const sx = mx <= 1.01 ? L : mx <= 100.5 && mx > 70 ? L/100 : mx <= 120.5 && mx > 105.5 ? L/120 : 1;
      const sy = my <= 1.01 ? W : my <= 100.5 && my > 68.5 ? W/100 : my <= 80.5 && my > 68.5 ? W/80 : 1;
      for (const r of body){
        const rawName = String(r[cols.action] ?? "").trim(); if (!rawName) continue;
        let teamHint = null;
        if (cols.team != null){
          const tv = norm(r[cols.team]);
          if (tv){ teamHint = (tv.includes("pau") || ["nous","us","off","dom","domicile","home"].includes(tv)) ? "us" : "them"; if (teamHint === "them" && !oppName) oppName = String(r[cols.team]).trim(); }
        }
        const {k, tm} = canon(rawName, teamHint);
        const minute = cols.minute != null ? (String(r[cols.minute]).includes(":") ? parseTime(r[cols.minute])/60 : num(r[cols.minute])) : null;
        const ev = {id:uid(), n:rawName, k, tm, t: minute != null ? minute*60 : 0, e: minute != null ? minute*60 : 0};
        const pl = cols.player != null ? String(r[cols.player] ?? "").trim() : "";
        if (pl && tm === "us"){ ev.p = [pl]; players.add(pl); }
        let x = cols.x != null ? num(r[cols.x]) : null, y = cols.y != null ? num(r[cols.y]) : null;
        if (x != null && y != null){ x = clamp(x*sx,0,L); y = clamp(y*sy,0,W); }
        if (cols.zone != null){ const zv = String(r[cols.zone]).toUpperCase().replace(/\s/g,""); const m = zv.match(/^Z?(1[0-8]|[1-9])$/); if (m) ev.z = "Z"+m[1]; }
        if (!ev.z && x != null && y != null && k !== "TIR" && k !== "BUT") ev.z = zoneFromXY(x,y);
        if (cols.corridor != null){ const cv = norm(r[cols.corridor]); ev.c = cv.startsWith("g") ? "G" : cv.startsWith("d") ? "D" : cv ? "A" : undefined; if (!ev.c) delete ev.c; }
        const isShot = k === "TIR" || (k === "BUT" && x != null);
        if (isShot && x != null && y != null){
          if (x < L/2){ x = L - x; y = W - y; }
          const bv = norm(cols.body != null ? r[cols.body] : "");
          const body = /tet|head/.test(bv) ? "tete" : (!bv || /pied|foot|droit|gauche|left|right/.test(bv)) ? "pied" : "autre";
          const rv = norm(cols.result != null ? r[cols.result] : "");
          const res = k === "BUT" || /but|goal/.test(rv) ? "but" : /cadr|target|arret|save/.test(rv) && !/non|hors|off/.test(rv) ? "cadre" : /contr|block/.test(rv) ? "contre" : "horscadre";
          const sv = norm(cols.situation != null ? r[cols.situation] : "");
          const sit = /pen/.test(sv) ? "penalty" : /contre|transi|counter/.test(sv) ? "contre" : /cpa|corner|coup|franc|set/.test(sv) ? "cpa" : "jeu";
          const ov = cols.opp != null ? num(r[cols.opp]) : null;
          shots.push({id:uid(), tm, x, y, body, opp: ov != null ? Math.round(ov) : 1, sit, res, p: pl || "", min: minute != null ? Math.round(minute) : null});
        } else events.push(ev);
      }
      continue;
    }
    // Tableau de statistiques : libellé | valeur Pau | valeur adversaire  (ou fiche par joueur)
    const numericCols = header.map((_,i) => i).filter(i => i > 0 && body.filter(r => num(r[i]) != null).length >= Math.max(1, body.length*.5));
    if (!numericCols.length) continue;
    const firstH = norm(header[0]);
    if (["joueur","player","nom","joueurs"].includes(firstH) || /joueur|player|indiv/.test(norm(sheetName))){
      for (const r of body){
        const nm = String(r[0] ?? "").trim(); if (!nm) continue; players.add(nm);
        perPlayer[nm] = perPlayer[nm] || {};
        numericCols.forEach(i => { const v = num(r[i]); if (v != null) perPlayer[nm][header[i].trim() || ("Col "+i)] = v; });
      }
    } else if (numericCols.length >= 2){
      let iu = numericCols[0], it = numericCols[1];
      const pauCol = numericCols.find(i => /pau/i.test(header[i]));
      if (pauCol != null){ iu = pauCol; it = numericCols.find(i => i !== pauCol); }
      if (!oppName) oppName = String(header[it] || "").trim();
      for (const r of body){ const lb = String(r[0] ?? "").trim(); const a = num(r[iu]), b = num(r[it]); if (lb && (a != null || b != null)) stats.push({label:lb, us:a ?? 0, them:b ?? 0}); }
    }
  }
  if (!events.length && !shots.length && !stats.length && !Object.keys(perPlayer).length)
    throw new Error("Aucune donnée reconnue. Il faut une colonne « Action » (avec Équipe, X, Y, Joueur… si possible), ou un tableau Statistique | Pau | Adversaire.");
  const g = guessTeams(title);
  return newMatch({title, opponent: oppName && !/^(adv|adversaire|them)$/i.test(oppName) ? oppName : g.opponent, venue:g.venue, events, shots, stats, perPlayer, players:[...players], source:{name:fileName, format:"Tableur"}});
}
function parseCSV(text){
  const first = text.split(/\r?\n/).slice(0,5).join("\n");
  const delim = [";","\t",","].map(d => [d, (first.match(new RegExp(d === "\t" ? "\t" : "\\"+d, "g"))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows = []; let row = [], cell = "", q = false;
  for (let i=0; i<text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if (ch === '"') q = true;
    else if (ch === delim){ row.push(cell); cell = ""; }
    else if (ch === "\n"){ row.push(cell.replace(/\r$/,"")); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
async function parseFileBuffer(buf, name){
  const ext = (name.split(".").pop() || "").toLowerCase();
  if (ext === "json"){
    const j = JSON.parse(decodeText(buf));
    if (!j || !Array.isArray(j.events)) throw new Error("Ce JSON n'est pas un export de match de cette application.");
    return newMatch({...j, id:undefined});
  }
  if (ext === "xlsx" || ext === "xls"){
    await loadScript(LIB.xlsx);
    const wb = window.XLSX.read(new Uint8Array(buf), {type:"array"});
    const sheets = wb.SheetNames.map(n => ({name:n, rows: window.XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:"", raw:true})}));
    return parseRows(sheets, name);
  }
  const text = decodeText(buf);
  if (ext === "xml" || /^\s*<\?xml|^\s*<\w/.test(text)) return parseXML(text, name);
  return parseRows([{name:"csv", rows: parseCSV(text)}], name);
}

/* =========================================================
   Modèle de match et statistiques
   ========================================================= */
function newMatch(o){
  return {
    id: o.id || uid(), title: o.title || "Nouveau match", opponent: o.opponent || "", oppColor: o.oppColor || "#d7263d",
    oppLogo: o.oppLogo || null, date: o.date || "", competition: o.competition || "", journee: o.journee || "", live: o.live || null, venue: o.venue || "dom",
    scoreUs: o.scoreUs ?? null, scoreThem: o.scoreThem ?? null,
    events: o.events || [], shots: o.shots || [], stats: o.stats || [], perPlayer: o.perPlayer || {}, players: o.players || [],
    source: o.source || null, sample: !!o.sample, createdAt: o.createdAt || Date.now(), updatedAt: Date.now()
  };
}
function teamEvents(m){ return m.events.filter(e => !e.pl); }
function count(m, k, tm, pred){ return teamEvents(m).filter(e => e.k === k && e.tm === tm && (!pred || pred(e))).length; }
function linkedEventIds(m){ return new Set(m.shots.map(s => s.ev).filter(Boolean)); }
function teamStats(m){
  const linked = linkedEventIds(m);
  const st = {};
  for (const tm of ["us","them"]){
    const shots = m.shots.filter(s => s.tm === tm);
    const shotEvents = count(m,"TIR",tm);
    const freeShots = shots.filter(s => !s.ev).length;
    const goalsEv = count(m,"BUT",tm);
    st[tm] = {
      shots: shotEvents + freeShots,
      onTarget: shots.filter(s => s.res === "but" || s.res === "cadre").length,
      placed: shots.length,
      unplaced: teamEvents(m).filter(e => e.k === "TIR" && e.tm === tm && !linked.has(e.id)).length,
      xg: shots.reduce((a,s) => a + xgOf(s), 0),
      goalsData: goalsEv || shots.filter(s => s.res === "but").length,
      entries: count(m,"20M",tm), crosses: count(m,"CENTRE",tm), transitions: count(m,"TRANSITION",tm),
      corners: count(m,"CORNER",tm) + count(m,"CPA",tm,e => hasL(e,"CORNER")), freeKicks: count(m,"CF",tm) + count(m,"CFI",tm) + count(m,"CPA",tm,e => hasL(e,"COUP FRANC")), throws: count(m,"TOUCHE",tm),
      fouls: count(m,"FAUTE",tm), offsides: count(m,"HJ",tm), penalties: count(m,"PENALTY",tm) + count(m,"CPA",tm,e => hasL(e,"PENALTY")),
      pressing: count(m,"PRESSING",tm), buildups: count(m,"SORTIE DE BALLE",tm), cards: count(m,"CARTON",tm),
      possSec: teamEvents(m).filter(e => e.k === "POSSESSION" && e.tm === tm).reduce((a,e) => a + Math.max(0,((e.e ?? (e.live ? nowSec(m) : e.t)) || 0)-(e.t||0)), 0)
    };
  }
  st.us.recups = count(m,"RECUP","us") + count(m,"PERTE","them");
  st.them.recups = count(m,"RECUP","them") + count(m,"PERTE","us");
  st.us.goals = m.scoreUs ?? st.us.goalsData; st.them.goals = m.scoreThem ?? st.them.goalsData;
  const ps = st.us.possSec + st.them.possSec;
  st.possCoded = st.us.possSec > 0 && st.them.possSec > 0;
  st.us.poss = ps ? st.us.possSec/ps*100 : 0; st.them.poss = ps ? st.them.possSec/ps*100 : 0;
  return st;
}
// Grilles : récupérations Pau et pertes Pau, dans le repère Pau (attaque vers la droite)
function zoneCounts(m, kind, filter){
  const counts = Object.fromEntries(ZONES.map(z => [z,0])); const bands = {}, pts = [], todo = []; let tagged = 0, total = 0;
  const ev = (filter ? filter(teamEvents(m)) : teamEvents(m));
  for (const e of ev){
    let z = null, b = null, hit = false;
    if (kind === "recup" && ((e.k === "RECUP" && e.tm === "us") || (e.k === "PERTE" && e.tm === "them"))){ hit = true; z = e.z ? (e.tm === "us" ? e.z : mirrorZone(e.z)) : null; b = e.tm === "us" ? e.b : null; }
    if (kind === "perte" && ((e.k === "PERTE" && e.tm === "us") || (e.k === "RECUP" && e.tm === "them"))){ hit = true; z = e.z ? (e.tm === "us" ? e.z : mirrorZone(e.z)) : null; b = e.tm === "us" ? e.b : null; }
    if (!hit) continue; total++;
    if (e.px != null){ z = zoneFromXY(e.px, e.py); pts.push({x:e.px, y:e.py, id:e.id}); } else if (!e.noShot) todo.push(e);
    if (z){ counts[z]++; tagged++; } else if (b){ bands[b] = (bands[b]||0) + 1; }
  }
  return {counts, tagged, total, bands, pts, todo};
}
function entryCounts(m, tm){
  const c = {G:0, A:0, D:0}; let total = 0;
  for (const e of teamEvents(m)) if (e.k === "20M" && e.tm === tm){ total++; if (e.c) c[e.c]++; }
  return {c, total, tagged: c.G + c.A + c.D};
}
function periodCounts(m, k){
  const ev = teamEvents(m).filter(e => e.t > 0);
  if (!ev.length) return null;
  const t0 = Math.min(...ev.map(e => e.t)), t1 = Math.max(...ev.map(e => e.t));
  const span = Math.max(1, t1 - t0);
  const out = Array.from({length:6}, () => ({us:0, them:0}));
  for (const e of ev){
    let hit = e.k === k;
    if (k === "RECUP_ALL"){ hit = e.k === "RECUP" || e.k === "PERTE"; }
    if (!hit) continue;
    let tm = e.tm;
    if (k === "RECUP_ALL" && e.k === "PERTE") tm = tm === "us" ? "them" : "us";
    out[Math.min(5, Math.floor((e.t - t0)/span*6))][tm]++;
  }
  return out;
}
function playerList(m){
  const s = new Set(m.players);
  m.events.forEach(e => e.pl && e.w === "i" && s.add(e.pl));
  m.shots.forEach(x => x.p && x.tm === "us" && s.add(x.p));
  Object.keys(m.perPlayer || {}).forEach(p => s.add(p));
  teamEvents(m).forEach(e => (e.p||[]).forEach(p => s.add(p)));
  return [...s].filter(Boolean).sort((a,b) => a.localeCompare(b,"fr"));
}
function playerStats(m, name){
  const up = name.toUpperCase();
  const tags = m.events.filter(e => e.pl && e.pl.toUpperCase() === up);
  const tactical = teamEvents(m);
  const linked = new Map();
  for (const t of tactical){
    const direct = (t.p||[]).some(p => p.toUpperCase() === up);
    const mid = ((t.t||0) + (t.e||t.t||0))/2;
    const overlap = tags.some(p => (p.t <= mid && mid <= p.e) || Math.abs(p.t - t.t) < 2);
    if (direct || overlap) linked.set(t.id, t);
  }
  const ev = [...linked.values()];
  const byAction = {};
  ev.forEach(e => { byAction[e.n] = (byAction[e.n]||0) + 1; });
  const shots = m.shots.filter(s => s.tm === "us" && s.p && s.p.toUpperCase() === up);
  const notes = {pos:0, ame:0, int:0}; const remarks = [];
  tags.forEach(t => { if (t.r) notes[t.r]++; const txt = String(t.rm||"").trim(); if (txt) remarks.push({r:t.r, txt, t:t.t}); });
  const zr = zoneCounts(m, "recup", () => ev), zp = zoneCounts(m, "perte", () => ev);
  return {name, tags:tags.length, ev, byAction, shots, notes, remarks, zr, zp, ind: indivBreakdown(tags), indN: tags.filter(t => t.w === "i").length,
    actions: ev.length, xg: shots.reduce((a,s) => a + xgOf(s), 0), goals: shots.filter(s => s.res === "but").length + ev.filter(e => e.k === "BUT" && e.tm === "us").length,
    recups: ev.filter(e => e.k === "RECUP" && e.tm === "us").length, pertes: ev.filter(e => e.k === "PERTE" && e.tm === "us").length,
    extra: (m.perPlayer || {})[name] || null};
}
// Bilan du codage indiv d'un joueur : action (label sans groupe) + résultat (labels liés à l'action, ex. RESULT PASSE → PASSE)
function indivBreakdown(tags){
  const rows = {};
  const row = (k) => rows[k] = rows[k] || {k, n:0, ok:0, ko:0, side: IND_SIDE[k] || "off"};
  for (const e of tags){
    if (e.w !== "i") continue;
    const labs = (e.l || []).filter(x => !/^(COMPETITION|JOURNEE|LIEU|EQUIPE|ADV|Halftime|QT|Minute)$/.test(x.g));
    const actions = new Set(labs.filter(x => !x.g).map(x => x.t));
    labs.filter(x => x.g).forEach(x => { const act = IND_RES[x.g + "|" + x.t]; if (act) actions.add(act); else if (!IND_OK.has(x.t) && !IND_KO.has(x.t)) row(x.g + " : " + x.t).n++; });
    actions.forEach(a => { const r = row(a); r.n++;
      const res = labs.find(x => x.g && IND_RES[x.g + "|" + x.t] === a && (IND_OK.has(x.t) || IND_KO.has(x.t)));
      if (res && IND_OK.has(res.t)) r.ok++; else if (res && IND_KO.has(res.t)) r.ko++; });
  }
  return rows;
}
function mergeStats(list){
  const out = {name:list[0]?.name || "", ind:{}, indN:0, tags:0, ev:[], byAction:{}, shots:[], notes:{pos:0,ame:0,int:0}, remarks:[], actions:0, xg:0, goals:0, recups:0, pertes:0,
    zr:{counts:Object.fromEntries(ZONES.map(z=>[z,0])), tagged:0, total:0, bands:{}}, zp:{counts:Object.fromEntries(ZONES.map(z=>[z,0])), tagged:0, total:0, bands:{}}, extra:null, matches:list.length};
  for (const s of list){
    out.indN += s.indN || 0; for (const k in (s.ind || {})){ const r = out.ind[k] = out.ind[k] || {k, n:0, ok:0, ko:0, side:s.ind[k].side}; r.n += s.ind[k].n; r.ok += s.ind[k].ok; r.ko += s.ind[k].ko; }
    out.tags += s.tags; out.actions += s.actions; out.xg += s.xg; out.goals += s.goals; out.recups += s.recups; out.pertes += s.pertes;
    out.shots.push(...s.shots); s.remarks.forEach(r => out.remarks.push(r));
    for (const k in s.byAction) out.byAction[k] = (out.byAction[k]||0) + s.byAction[k];
    for (const k in s.notes) out.notes[k] += s.notes[k];
    for (const key of ["zr","zp"]){ ZONES.forEach(z => out[key].counts[z] += s[key].counts[z]); out[key].tagged += s[key].tagged; out[key].total += s[key].total; for (const b in s[key].bands) out[key].bands[b] = (out[key].bands[b]||0) + s[key].bands[b]; }
    if (s.extra){ out.extra = out.extra || {}; for (const k in s.extra) out.extra[k] = (out.extra[k]||0) + s.extra[k]; }
  }
  return out;
}

   Match d'exemple (données fictives, jamais enregistrées)
   ========================================================= */
function sampleMatch(){
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd()*a.length)];
  const players = ["Joueur 2","Joueur 4","Joueur 5","Joueur 6","Joueur 7","Joueur 8","Joueur 9","Joueur 10","Joueur 11","Joueur 14","Joueur 17"];
  const events = []; let t = 120;
  const weighted = (k) => { // zone pondérée selon l'action
    const rows = k === "PERTE" ? [0,1,2,2,3,3,3,4,4,5] : [0,1,1,2,2,2,3,3,4,5];
    return "Z" + (pick(rows)*3 + Math.floor(rnd()*3) + 1);
  };
  const add = (n, extra={}) => { const {k,tm} = canon(n); const ev = {id:uid(), n, k, tm, t, e:t+8, ...extra}; events.push(ev); t += 8 + rnd()*40; return ev; };
  for (let i=0;i<300;i++){
    const r = rnd();
    if (r < .17) { const ev = add("RECUP", {z:weighted("RECUP")}); events.push({id:uid(), pl:pick(players), t:ev.t, e:ev.e, r: rnd()<.6 ? "pos" : rnd()<.5 ? "int" : null, rm:""}); }
    else if (r < .32) { const ev = add("PERTE", {z:weighted("PERTE")}); events.push({id:uid(), pl:pick(players), t:ev.t, e:ev.e, r: rnd()<.55 ? "ame" : null, rm:""}); }
    else if (r < .40) add("20M OFF", {c:pick(["G","A","A","D","D"])});
    else if (r < .46) add("20M DEF", {c:pick(["G","G","A","D"])});
    else if (r < .53) add("CENTRE OFF");
    else if (r < .57) add("CENTRE DEF");
    else if (r < .62) add("TRANSITION OFF");
    else if (r < .66) add("TRANSITION DEF");
    else if (r < .70) add("CORNER");
    else if (r < .72) add("CORNER DEF");
    else if (r < .77) add("FAUTE CONTRE");
    else if (r < .82) add("FAUTE POUR");
    else if (r < .86) add("TOUCHE");
    else if (r < .90) add("TOUCHE DEF");
    else if (r < .92) add("HJ");
    else if (r < .93) add("HJ ADV");
    else { t += 20; }
  }
  const shotsUs = [[94,31,"pied",1,"jeu","but","Joueur 9",12],[88,40,"pied",2,"jeu","cadre","Joueur 10",19],[99,35,"tete",1,"cpa","horscadre","Joueur 5",23],[80,26,"pied",3,"jeu","contre","Joueur 8",31],[93.5,34,"pied",1,"penalty","but","Joueur 9",44],[86,22,"pied",2,"contre","cadre","Joueur 11",52],[97,30,"tete",2,"cpa","cadre","Joueur 4",58],[78,38,"pied",4,"jeu","horscadre","Joueur 6",63],[90,45,"pied",1,"contre","horscadre","Joueur 7",71],[95,37,"pied",2,"jeu","cadre","Joueur 9",77],[83,30,"autre",3,"jeu","contre","Joueur 17",84],[100,33,"pied",1,"jeu","horscadre","Joueur 14",88]];
  const shotsThem = [[85,30,"pied",3,"jeu","horscadre",15],[92,40,"tete",2,"cpa","cadre",27],[78,34,"pied",4,"jeu","contre",39],[89,25,"pied",2,"contre","but",56],[82,44,"pied",3,"jeu","cadre",67],[96,36,"tete",3,"cpa","horscadre",80],[75,30,"pied",5,"jeu","horscadre",89]];
  const shots = [
    ...shotsUs.map(([x,y,body,opp,sit,res,p,min]) => ({id:uid(), tm:"us", x, y, body, opp, sit, res, p, min})),
    ...shotsThem.map(([x,y,body,opp,sit,res,min]) => ({id:uid(), tm:"them", x, y, body, opp, sit, res, p:"", min}))
  ];
  shots.filter(s => s.tm === "us").forEach(s => events.push({id:uid(), pl:s.p, t:2000 + s.min*60, e:2005 + s.min*60, r: s.res === "but" ? "pos" : s.res === "horscadre" ? "ame" : "int", rm: s.res === "but" ? "Bonne prise d'espace dans le dos" : ""}));
  return newMatch({id:"exemple", title:"Exemple · Pau FC v Adversaire", opponent:"Adversaire (exemple)", oppColor:"#d7263d", date:"", competition:"Données fictives",
    venue:"dom", events, shots, players, scoreUs:2, scoreThem:1, sample:true, stats:[{label:"Passes réussies (%)", us:82, them:76},{label:"Duels gagnés", us:54, them:49}],
    perPlayer:{"Joueur 9":{"Distance (km)":10.4,"Sprints":21},"Joueur 10":{"Distance (km)":11.2,"Sprints":17},"Joueur 6":{"Distance (km)":11.9,"Sprints":12}}});
}

/* =========================================================
   Stockage : base de l'artefact (matchs, documents), fichiers, téléchargements
   ========================================================= */
const S = {db:null, assets:null, downloads:null, mode:"local"};
const state = {
  matches: new Map(), docs: [], players: {}, settings: {},
  currentId: null, view: "collectif", player: null, scope: "match",
  shotEdit: false, shotSel: null, draft: {body:"pied", opp:1, sit:"jeu", res:"cadre", p:"", min:"", ev:""}, hover: null,
  zoneEdit: null, zoneOp: "add", entryEdit: false, ready: false
};
const LS_KEY = "paufc-analyse-v1";
function lsRead(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch { return null; } }
function lsWrite(){
  if (S.mode !== "local") return;
  try { localStorage.setItem(LS_KEY, JSON.stringify({matches:[...state.matches.values()].filter(m => !m.sample), currentId:state.currentId})); }
  catch { toast("Le stockage du navigateur est plein : ce match n'a pas pu être enregistré."); }
}
const saveTimers = {};
function persist(m){
  m.updatedAt = Date.now();
  if (m.sample) return;
  if (S.mode === "local"){ lsWrite(); return; }
  clearTimeout(saveTimers[m.id]);
  saveTimers[m.id] = setTimeout(async () => {
    try {
      const body = JSON.parse(JSON.stringify(m));
      if (JSON.stringify(body).length > 250000){ body.events = body.events.map(e => { const c = {...e}; delete c.rm; return c; }); }
      await S.db.collection("matches").doc(m.id).set(body);
    } catch (e){ console.error(e); toast(e && e.code === "quota_exceeded" ? "La base est pleine : supprime d'anciens matchs." : "Enregistrement impossible pour l'instant (" + ((e && (e.code || e.message)) || "erreur") + "). Réessaie dans un moment."); }
  }, 500);
}
function thaw(o){ if (o == null) return o; try { return structuredClone(o); } catch { return JSON.parse(JSON.stringify(o)); } }
async function removeMatch(id){
  state.matches.delete(id);
  if (S.mode === "local") lsWrite();
  else { try { await S.db.collection("matches").doc(id).delete(); } catch { toast("Suppression impossible pour l'instant."); } }
}
async function initStorage(){
  const local = lsRead();
  if (local && local.matches) local.matches.forEach(m => state.matches.set(m.id, m));
  if (local && local.currentId) state.currentId = local.currentId;
  render();
  if (!window.claude || !window.claude.use) return;
  const [db, assets, downloads, sample] = await Promise.all(["db","assets","downloads","sample"].map(n => window.claude.use(n).catch(() => null)));
  S.assets = assets; S.downloads = downloads; AI.sample = sample; renderAI();
  if (sample && sample.keyStatus) sample.keyStatus().then(k => { AI.key = k; renderAI(); }).catch(() => {});
  if (db){
    S.db = db; S.mode = "cloud";
    db.collection("matches").onSnapshot(snap => {
      const seen = new Set();
      // Les données lues dans la base sont figées : on travaille toujours sur une copie modifiable
      let changed = false;
      snap.docs.forEach(d => { const m = thaw(d.data()); if (!m) return; seen.add(d.id); const cur = state.matches.get(d.id); if (!cur || (m.updatedAt||0) > (cur.updatedAt||0)){ state.matches.set(d.id, {...m, id:d.id}); changed = true; } });
      for (const id of [...state.matches.keys()]) if (!seen.has(id) && !state.matches.get(id).sample && !saveTimers[id]){ state.matches.delete(id); changed = true; }
      if (local && local.matches && local.matches.length && !state.migrated){ state.migrated = true; local.matches.forEach(m => { if (!seen.has(m.id)){ state.matches.set(m.id, m); persist(m); } }); }
      if (changed || !state.ready){ state.ready = true; render(); }
    }, () => toast("La base de matchs est indisponible : les changements restent dans ce navigateur."));
    db.collection("docs").onSnapshot(snap => { state.docs = snap.docs.map(d => ({...thaw(d.data()), id:d.id})).sort((a,b) => (b.createdAt||0) - (a.createdAt||0)); if (state.view === "docs") render(); }, () => {});
    db.collection("players").onSnapshot(snap => { state.players = {}; snap.docs.forEach(d => state.players[d.id] = thaw(d.data())); render(); }, () => {});
    db.doc("settings/app").onSnapshot(s => { state.settings = (s.exists && thaw(s.data())) || {}; applyCustomWins(); render(); }, () => {});
  }
  render();
}
function current(){
  let m = state.currentId && state.matches.get(state.currentId);
  if (!m){
    const list = [...state.matches.values()].filter(x => !x.sample).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    m = list[0];
    if (!m){ if (!state.matches.has("exemple")) state.matches.set("exemple", sampleMatch()); m = state.matches.get("exemple"); }
    state.currentId = m.id;
  }
  return m;
}
const blobUrl = id => id ? "/_blob/" + id : null;

// Fichiers : types natifs envoyés tels quels, les autres (XML, Excel, Word…) emballés en texte base64
const NATIVE = {pdf:"application/pdf", png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg", webp:"image/webp", gif:"image/gif", mp4:"video/mp4", webm:"video/webm"};
const DL_OK = window.__NATIVE__ ? {has: () => true} : new Set("gif png jpg jpeg webp mp4 webm mov txt json md docx pptx epub csv ttf html svg pdf xlsx zip".split(" "));
async function storeFile(file, matchId){
  if (!S.assets || !S.db) throw new Error("Le stockage de documents n'est disponible que dans l'application ouverte sur claude.ai.");
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  const buf = await file.arrayBuffer();
  let blob, type, wrapped = false;
  if (NATIVE[ext]){ blob = new Blob([buf], {type:NATIVE[ext]}); type = NATIVE[ext]; }
  else { blob = new Blob(["PAUFC-B64\n" + (file.type || "application/octet-stream") + "\n" + bytesToB64(buf)], {type:"text/plain"}); type = "text/plain"; wrapped = true; }
  const up = await S.assets.upload(blob, {type});
  const doc = {name:file.name, ext, size:buf.byteLength, assetId:up.id, wrapped, createdAt:Date.now(), matchId: matchId || null};
  await S.db.collection("docs").doc(uid()).set(doc);
  return doc;
}
async function fetchDocBytes(d){
  const r = await fetch(blobUrl(d.assetId));
  if (!r.ok) throw new Error("Fichier introuvable dans le stockage.");
  if (!d.wrapped) return new Uint8Array(await r.arrayBuffer());
  const txt = await r.text(); const parts = txt.split("\n");
  return b64ToBytes(parts.slice(2).join(""));
}
async function saveFile(filename, data){
  if (!S.downloads){
    if (!window.claude){ const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return true; }
    toast("Le téléchargement n'est pas disponible dans cette vue. Ouvre l'application sur claude.ai."); return false; }
  try { await S.downloads.save({filename, data}); return true; }
  catch (e){ if (e && e.code !== "declined") toast(e && e.code === "rejected_extension" ? "Ce format ne peut pas être téléchargé ici." : "Téléchargement impossible : " + (e && e.message || "erreur inconnue")); return false; }
}

function pitchLines(x0=0, half=null){
  // half: null = terrain complet ; "right" = moitié offensive (x 52.5 → 105)
  const ln = 'fill="none" stroke="var(--pitch-line)" stroke-width=".35"';
  const box = (gx, dir) => {
    const bx = dir > 0 ? gx - 16.5 : gx, sx = dir > 0 ? gx - 5.5 : gx;
    const spot = gx - dir*11;
    const arcX = gx - dir*16.5;
    const dy = Math.sqrt(9.15*9.15 - 5.5*5.5);
    return `<rect x="${bx}" y="${W/2-20.16}" width="16.5" height="40.32" ${ln}/>
      <rect x="${sx}" y="${W/2-9.16}" width="5.5" height="18.32" ${ln}/>
      <circle cx="${spot}" cy="${W/2}" r=".35" fill="var(--pitch-line)"/>
      <path d="M ${arcX} ${W/2-dy} A 9.15 9.15 0 0 ${dir>0?0:1} ${arcX} ${W/2+dy}" ${ln}/>
      <rect x="${dir>0?gx:gx-2}" y="${W/2-GOAL_HALF}" width="2" height="${GOAL_HALF*2}" ${ln}/>`;
  };
  let stripes = "";
  for (let i=0;i<12;i++) if (i%2) stripes += `<rect x="${i*L/12}" y="0" width="${L/12}" height="${W}" fill="var(--pitch-stripe)"/>`;
  return `<rect x="0" y="0" width="${L}" height="${W}" fill="var(--pitch)"/>${stripes}
    <rect x="0" y="0" width="${L}" height="${W}" ${ln}/>
    <line x1="${L/2}" y1="0" x2="${L/2}" y2="${W}" ${ln}/>
    <circle cx="${L/2}" cy="${W/2}" r="9.15" ${ln}/><circle cx="${L/2}" cy="${W/2}" r=".4" fill="var(--pitch-line)"/>
    ${box(L,1)}${box(0,-1)}`;
}
function svgOpen(vb, cls="", extra=""){ return `<svg class="pitch-svg ${cls}" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" ${extra}>`; }
function arrowDefs(){ return `<defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-2)"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-2)"/></marker></defs>`; }

function zoneGridSVG(zc, color, {editing=false, kind="", print=false}={}){
  const max = Math.max(1, ...Object.values(zc.counts));
  const pts = zc.pts || [];
  let cells = "";
  if (zc.tagged > 0 || editing || pts.length || !Object.keys(zc.bands).length){
    for (const z of ZONES){
      const r = zoneRect(z), v = zc.counts[z];
      const op = v ? .15 + .75*(v/max) : 0;
      const txt = v ? (op > .55 ? inkOn(color) : (print ? "#0d1a3a" : "var(--ink)")) : (print ? "#9aa3bf" : "var(--ink-2)");
      // Avec des points placés, le total de la zone passe dans le coin pour laisser voir les points
      const label = pts.length ? `<text x="${r.x+1.8}" y="${r.y+5}" font-size="${v?4.4:3}" fill="${txt}" font-weight="700">${v || z}</text>`
        : `<text x="${r.x+r.w/2}" y="${r.y+r.h/2+2.6}" text-anchor="middle" font-size="${v?7:4}" fill="${txt}">${v || z}</text>`;

    }

    cells += pts.map(p => `<circle class="zpt" data-id="${p.id}" cx="${p.x}" cy="${p.y}" r="1.5" fill="${color}" stroke="${ring}" stroke-width=".55"/>`).join("");
  } else {
    // Repli : bandes de profondeur codées sans zone précise
    const order = ["BASSE","MED BASSE","MED HAUTE","HAUTE"]; const bmax = Math.max(1, ...Object.values(zc.bands));
    order.forEach((b,i) => { const v = zc.bands[b]||0, op = v ? .15+.75*(v/bmax) : 0;
      cells += `<rect x="${i*L/4+.4}" y=".4" width="${L/4-.8}" height="${W-.8}" rx="1.2" fill="${color}" fill-opacity="${op}" stroke="var(--pitch-line)" stroke-width=".25"/>

      <text x="${i*L/4+L/8}" y="${W/2+7}" text-anchor="middle" font-size="3.4" fill="var(--ink-2)">${b}</text>`; });
  }
  const linesPrint = print ? pitchLines().replaceAll("var(--pitch-line)","#b9c6bb").replaceAll("var(--pitch-stripe)","#eef4ee").replaceAll("var(--pitch)","#f6faf6") : pitchLines();
  return `${svgOpen(`-2 -6 ${L+4} ${W+8}`, editing ? "editing" : "", kind ? `data-role="zonemap" data-kind="${kind}"` : "")}${arrowDefs()}${linesPrint}${cells}
    <line x1="${L*0.62}" y1="-3" x2="${L*0.82}" y2="-3" stroke="${print?'#56618a':'var(--ink-2)'}" stroke-width=".5" marker-end="url(#arr)"/>
    <text x="${L*0.6}" y="-1.8" text-anchor="end" font-size="3.6" fill="${print?'#56618a':'var(--ink-2)'}">SENS DU JEU PAU</text></svg>`;
}
function entriesSVG(ec, color, tm, editing, print=false){

  const x0 = 60, lanes = [["G",0,W/2-20.16],["A",W/2-20.16,W/2+20.16],["D",W/2+20.16,W]];
  const max = Math.max(1, ec.c.G, ec.c.A, ec.c.D);

function xgChartSVG(m, print=false){
  const w = 320, h = 150, pad = {l:28, r:10, t:10, b:22};
  const shots = m.shots.slice();
  const timed = shots.length && shots.every(s => Number.isFinite(s.min));
  if (!shots.length) return "";
  const series = {us:[{x:0,y:0}], them:[{x:0,y:0}]};
  const sorted = timed ? shots.sort((a,b) => a.min - b.min) : shots;
  const tot = {us:0, them:0};
  sorted.forEach((s,i) => { const x = timed ? s.min : i+1; series[s.tm].push({x, y:tot[s.tm]}); tot[s.tm] += xgOf(s); series[s.tm].push({x, y:tot[s.tm], goal: s.res === "but"}); });
  const xmax = timed ? Math.max(90, ...shots.map(s => s.min)) : shots.length + 1;
  series.us.push({x:xmax, y:tot.us}); series.them.push({x:xmax, y:tot.them});
  const ymax = Math.max(1, Math.ceil(Math.max(tot.us, tot.them)*2)/2);
  const X = v => pad.l + (w-pad.l-pad.r)*v/xmax, Y = v => h - pad.b - (h-pad.t-pad.b)*v/ymax;
  const ink2 = print ? "#56618a" : "var(--ink-2)", line = print ? "#e3e7f0" : "var(--line)";
  let grid = "";
  for (let v=0; v<=ymax+1e-9; v+=ymax > 2 ? 1 : .5) grid += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${line}" stroke-width="1"/><text x="${pad.l-5}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="${ink2}">${String(v).replace(".",",")}</text>`;
  const ticks = timed ? [0,15,30,45,60,75,90].filter(v => v <= xmax) : [];
  ticks.forEach(v => grid += `<text x="${X(v)}" y="${h-6}" text-anchor="middle" font-size="9" fill="${ink2}">${v}'</text>`);
  if (!timed) grid += `<text x="${(w+pad.l)/2}" y="${h-6}" text-anchor="middle" font-size="9" fill="${ink2}">tirs dans l'ordre de saisie</text>`;
  const path = pts => pts.map((p,i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  const col = {us: print ? "#c99f00" : "var(--pau-deep)", them: m.oppColor || "#d7263d"};
  let lines = "";
  for (const tm of ["them","us"]){
    lines += `<path d="${path(series[tm])}" fill="none" stroke="${col[tm]}" stroke-width="2.4" stroke-linejoin="round"/>`;
    series[tm].filter(p => p.goal).forEach(p => lines += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="${col[tm]}" stroke="${print?'#fff':'var(--surface)'}" stroke-width="1.5"/>`);
    const last = series[tm][series[tm].length-1];
    lines += `<text x="${w-pad.r}" y="${Y(last.y)-5}" text-anchor="end" font-size="11" fill="${print ? '#0d1a3a' : 'var(--ink)'}">${fmt1(last.y)}</text>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" class="pitch-svg" role="img" aria-label="xG cumulés">${grid}${lines}</svg>`;
}
function periodSVG(data, opp){

}

function actionTable(m){
  const agg = {};
  teamEvents(m).forEach(e => { if (e.k === "POSSESSION") return; const key = KEY_LABEL[e.k] || e.k; agg[key] = agg[key] || {us:0, them:0}; agg[key][e.tm]++; });
  const rows = Object.entries(agg).sort((a,b) => (b[1].us+b[1].them) - (a[1].us+a[1].them));
  if (!rows.length) return `<div class="empty">Aucune action codée.</div>`;
  return `<div class="tscroll" style="max-height:320px;overflow:auto"><table class="t"><thead><tr><th>Action</th><th style="text-align:right">Pau</th><th style="text-align:right">Adv.</th></tr></thead><tbody>
    ${rows.map(([k,v]) => `<tr><td>${esc(k)}</td><td class="n">${v.us}</td><td class="n">${v.them}</td></tr>`).join("")}</tbody></table></div>`;
}

// Position exacte d'une récupération / perte, enregistrée dans le repère Pau (attaque vers la droite)
function placeEvent(ev, x, y){ ev.px = Math.round(x*10)/10; ev.py = Math.round(y*10)/10; const z = zoneFromXY(ev.px, ev.py); ev.z = ev.tm === "us" ? z : mirrorZone(z); delete ev.noShot; }
function svgPoint(svg, evt){
  const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return {x:p.x, y:p.y};
}
function pitchToShot(p){
  const x = clamp(p.x, 0, L), y = clamp(p.y, 0, W);
  if (x >= L/2) return {tm:"us", x, y};
  return {tm:"them", x: L - x, y: W - y};
}
document.addEventListener("click", async (evt) => {
  const t = evt.target.closest("[data-act]");
  const m = current();
  // Clics sur le terrain des tirs
  const svg = evt.target.closest('svg[data-role="shotmap"]');
  if (svg && state.view === "collectif"){
    const shotG = evt.target.closest(".shot");
    if (shotG && state.shotEdit){ state.shotSel = shotG.dataset.shot; render(); return; }
    if (state.shotEdit){
      const p = pitchToShot(svgPoint(svg, evt));
      const d = state.draft;
      if (d.sit === "penalty"){ p.x = L - 11; p.y = W/2; }
      let tm = p.tm;
      if (d.ev){ const ev = m.events.find(e => e.id === d.ev); if (ev) tm = ev.tm; if (tm !== p.tm){ p.x = p.x; } }
      const shot = {id:uid(), tm, x:p.x, y:p.y, body:d.body, opp:d.opp, sit:d.sit, res:d.res, p:d.p || "", min: d.min === "" || d.min == null ? null : Number(d.min)};
      if (d.ev) shot.ev = d.ev;
      m.shots.push(shot); state.draft.ev = ""; state.shotSel = null; persist(m);
      toast(`Tir ${tm === "us" ? "Pau" : "adverse"} ajouté · xG ${fmt1(xgOf(shot))}`, 1800);
      render(); return;
    }
  }
  const zsvg = evt.target.closest('svg[data-role="zonemap"]');
  if (zsvg && state.zoneEdit && zsvg.dataset.kind === state.zoneEdit){
    const kind = state.zoneEdit, k = kind === "recup" ? "RECUP" : "PERTE";
    const p = svgPoint(zsvg, evt); const x = clamp(p.x, 0, L), y = clamp(p.y, 0, W), z = zoneFromXY(x, y);
    if (state.zoneOp === "add"){
      const next = zoneCounts(m, kind).todo[0];
      if (next){ placeEvent(next, x, y); toast(`${KEY_LABEL[next.k] || next.k}${next.t ? " de " + mmss(pressTime(next)) : ""} placée en ${z}`, 1500); }
      else { const ev = {id:uid(), n:k + " (saisie)", k, tm:"us", t:0, e:0, man:1}; placeEvent(ev, x, y); m.events.push(ev); }
      persist(m); render(); return;
    }
    const near = zoneCounts(m, kind).pts.map(q => ({q, d:Math.hypot(q.x - x, q.y - y)})).sort((a,b) => a.d - b.d)[0];
    if (near && near.d < 5){ const ev = m.events.find(e => e.id === near.q.id); if (ev && ev.man) m.events.splice(m.events.indexOf(ev), 1); else if (ev){ delete ev.px; delete ev.py; ev.noShot = 1; } persist(m); render(); return; }
  }
  const zoneG = evt.target.closest(".zone");
  if (zoneG && state.zoneEdit && zoneG.dataset.kind === state.zoneEdit){
    const z = zoneG.dataset.zone, kind = state.zoneEdit;
    const k = kind === "recup" ? "RECUP" : "PERTE";
    if (state.zoneOp === "add") m.events.push({id:uid(), n:k + " (saisie)", k, tm:"us", t:0, e:0, z, man:1});
    else {
      const idx = [...m.events].reverse().findIndex(e => e.k === k && e.tm === "us" && e.z === z && e.man);
      const idx2 = idx >= 0 ? m.events.length - 1 - idx : m.events.findIndex(e => e.k === k && e.tm === "us" && e.z === z);
      if (idx2 >= 0) m.events.splice(idx2, 1); else toast("Rien à retirer dans cette zone.", 1600);
    }
    persist(m); render(); return;
  }
  const lane = evt.target.closest(".lane");
  if (lane && state.entryEdit){
    m.events.push({id:uid(), n:"20M (saisie)", k:"20M", tm:lane.dataset.team, t:0, e:0, c:lane.dataset.lane, man:1});
    persist(m); render(); return;
  }
  if (!t) return;
  const act = t.dataset.act;
  switch (act){
    case "view": state.view = t.dataset.v; state.shotEdit = false; state.zoneEdit = null; state.entryEdit = false; render(); break;
    case "import": $("#file-import").click(); break;
    case "pick-docs": $("#file-docs").click(); break;
    case "pdf": openPdfPreview(); break;
    case "edit-match": openMatchModal(m); break;
    case "new-match": { const nm = newMatch({title:"Nouveau match", opponent:""}); state.matches.set(nm.id, nm); state.currentId = nm.id; persist(nm); state.view = "collectif"; render(); openMatchModal(nm); break; }
    case "open-match": state.currentId = t.dataset.id; state.view = "collectif"; lsWrite(); render(); break;
    case "del-match": confirmBox(`Supprimer le match « ${esc(state.matches.get(t.dataset.id)?.title)} » ? Les documents stockés restent disponibles.`, "Supprimer", async () => { await removeMatch(t.dataset.id); if (state.currentId === t.dataset.id) state.currentId = null; render(); toast("Match supprimé."); }); break;
    case "export-json": { const mm = state.matches.get(t.dataset.id); if (mm) saveFile(slug(mm.title) + ".json", JSON.stringify(mm, null, 1)); break; }
    case "shot-edit": state.shotEdit = !state.shotEdit; state.shotSel = null; state.hover = null; render(); break;
    case "shot-desel": state.shotSel = null; render(); break;
    case "shot-del": { m.shots = m.shots.filter(s => s.id !== state.shotSel); state.shotSel = null; persist(m); render(); break; }
    case "draft": {
      const f = t.dataset.f, v = t.dataset.v;
      const sel = state.shotSel && m.shots.find(s => s.id === state.shotSel);
      if (sel){ sel[f] = v; if (f === "sit" && v === "penalty"){ sel.x = L - 11; sel.y = W/2; } persist(m); } else state.draft[f] = v;
      render(); break;
    }
    case "opp": {
      const sel = state.shotSel && m.shots.find(s => s.id === state.shotSel);
      const tgt = sel || state.draft; tgt.opp = clamp((tgt.opp||0) + Number(t.dataset.d), 0, 10); if (sel) persist(m); render(); break;
    }
    case "zone-edit": state.zoneEdit = t.dataset.kind || null; state.zoneOp = "add"; render(); break;
    case "zone-op": state.zoneOp = t.dataset.op; render(); break;
    case "entry-edit": state.entryEdit = !state.entryEdit; render(); break;
    case "period": state.period = t.dataset.k; render(); break;
    case "player": state.player = t.dataset.p; render(); break;
    case "scope": state.scope = t.dataset.v; render(); break;
    case "photo": pickImage(async (file) => { const up = await uploadImage(file); if (!up) return; await S.db.collection("players").doc(slug(state.player)).set({name:state.player, photo:up.id}); toast("Photo enregistrée."); }); break;
    case "club-logo": pickImage(async (file) => { const up = await uploadImage(file); if (!up) return; await S.db.doc("settings/app").set({...state.settings, clubLogo:up.id}); toast("Logo enregistré."); }); break;
    case "doc-dl": { const d = state.docs.find(x => x.id === t.dataset.id); if (!d) break; try { const bytes = await fetchDocBytes(d); const name = DL_OK.has(d.ext) ? d.name : d.name + ".txt"; const ok = await saveFile(name, bytes); if (ok && !DL_OK.has(d.ext)) toast("Ce format est enregistré avec .txt à la fin : renomme-le pour retrouver le ." + d.ext + "."); } catch (e){ toast(e.message); } break; }
    case "doc-open": { const d = state.docs.find(x => x.id === t.dataset.id); if (!d) break; try { const bytes = await fetchDocBytes(d); const mm = await parseFileBuffer(bytes.buffer, d.name); openImportModal([{match:mm, file:null, name:d.name}], d.id); } catch (e){ toast(e.message || "Ce fichier ne peut pas être lu comme un match."); } break; }
    case "doc-del": { const d = state.docs.find(x => x.id === t.dataset.id); if (!d) break; confirmBox(`Supprimer définitivement « ${esc(d.name)} » du stockage ?`, "Supprimer", async () => { try { await S.assets.delete(d.assetId); await S.db.collection("docs").doc(d.id).delete(); toast("Document supprimé."); } catch { toast("Suppression impossible pour l'instant."); } }); break; }
  }
});

let hoverRaf = 0;
document.addEventListener("pointermove", (evt) => {
  if (!state.shotEdit) return;
  const svg = evt.target.closest && evt.target.closest('svg[data-role="shotmap"]');
  if (!svg){ if (state.hover){ state.hover = null; } return; }
  if (hoverRaf) return;
  hoverRaf = requestAnimationFrame(() => {
    hoverRaf = 0;
    const p = pitchToShot(svgPoint(svg, evt));
    state.hover = p;
    const xg = xgOf({...state.draft, x:p.x, y:p.y});

    const sx = p.tm === "us" ? p.x : L - p.x, sy = p.tm === "us" ? p.y : W - p.y;

// Import de fichiers
$("#file-import").addEventListener("change", async (e) => { const files = [...e.target.files]; e.target.value = ""; await importFiles(files); });
$("#file-docs").addEventListener("change", async (e) => { const files = [...e.target.files]; e.target.value = ""; await storeDocs(files); });
async function importFiles(files){
  const results = [];
  for (const f of files){
    try { const buf = await f.arrayBuffer(); const m = await parseFileBuffer(buf, f.name); results.push({match:m, file:f, name:f.name}); }
    catch (err){ toast(`${f.name} : ${err.message || "lecture impossible"}`, 5000); }
  }
  if (results.length) openImportModal(results);
}
async function storeDocs(files){
  for (const f of files){
    if (f.size > 14.5*1024*1024 && !NATIVE[(f.name.split(".").pop()||"").toLowerCase()]){ toast(`${f.name} est trop lourd (14 Mo max pour ce format).`); continue; }
    try { await storeFile(f); toast(`${f.name} enregistré.`, 1800); }
    catch (err){ toast(`${f.name} : ${err.code === "too_large" ? "fichier trop lourd (20 Mo max)" : err.code === "quota_or_state" ? "stockage plein" : (err.message || "envoi impossible")}`, 5000); }
  }
}
function wireDrop(){
  const zone = $("#drop-docs"); if (!zone) return;
  zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", e => { e.preventDefault(); e.stopPropagation(); zone.classList.remove("over"); storeDocs([...e.dataTransfer.files]); });
}
document.addEventListener("dragover", e => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
document.addEventListener("drop", e => { if (e.defaultPrevented) return; if (!e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault(); importFiles([...e.dataTransfer.files]); });

function pickImage(cb){
  const inp = $("#file-image");
  inp.onchange = async () => { const f = inp.files[0]; inp.value = ""; if (f) { try { await cb(f); } catch (e){ toast(e.message || "Envoi impossible."); } } };
  inp.click();
}
async function uploadImage(file){
  if (!S.assets) { toast("L'envoi d'images fonctionne dans l'application ouverte sur claude.ai."); return null; }
  // Redimensionne à 400 px max avant l'envoi
  const img = await createImageBitmap(file);
  const sc = Math.min(1, 400/Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  try { return await S.assets.upload(blob, {type:"image/png"}); }
  catch (e){ toast(e.code === "quota_or_state" ? "Stockage plein." : "Envoi impossible pour l'instant."); return null; }
}

/* Modales */
function modal(html, cls=""){
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener("click", e => { if (e.target === bg) bg.remove(); });
  document.addEventListener("keydown", function k(e){ if (e.key === "Escape"){ bg.remove(); document.removeEventListener("keydown", k); } });
  document.body.appendChild(bg);
  const first = bg.querySelector("input,select,button"); if (first) first.focus();
  return bg;
}
function confirmBox(text, label, onYes){
  const bg = modal(`<h3>Confirmer</h3><p>${text}</p><div class="actions"><button class="btn" data-x="no">Annuler</button><button class="btn danger" data-x="yes">${esc(label)}</button></div>`);
  bg.querySelector('[data-x="no"]').onclick = () => bg.remove();
  bg.querySelector('[data-x="yes"]').onclick = async () => { bg.remove(); await onYes(); };
}
function colorField(id, value){
  return `<div class="swatches" id="${id}-sw">${OPP_COLORS.map(c => `<button type="button" data-c="${c}" style="background:${c}" aria-label="Couleur ${c}" aria-pressed="${c.toLowerCase()===String(value).toLowerCase()}"></button>`).join("")}<input type="color" id="${id}" value="${value}" aria-label="Couleur personnalisée"></div>`;
}
function bindColor(bg, id){
  const inp = bg.querySelector("#"+id);
  bg.querySelectorAll(`#${id}-sw button`).forEach(b => b.onclick = () => { inp.value = b.dataset.c; bg.querySelectorAll(`#${id}-sw button`).forEach(x => x.setAttribute("aria-pressed", x === b)); });
}

function openImportModal(results, fromDocId){
  const cur = current();
  const r0 = results[0].match;
  const summary = results.map(r => { const mm = r.match; const st = teamStats(mm);
    return `<li><strong>${esc(r.name)}</strong> · ${esc(mm.source?.format || "")} : ${teamEvents(mm).length} actions, ${playerList(mm).length} joueurs, ${mm.shots.length} tirs positionnés${mm.stats.length ? `, ${mm.stats.length} statistiques` : ""}${st.us.shots + st.them.shots ? ` (${st.us.shots + st.them.shots} tirs codés)` : ""}</li>`; }).join("");

    <div class="form">
      <label for="im-mode">Destination</label><select class="f" id="im-mode"><option value="new">Créer un nouveau match</option>${canMerge ? `<option value="merge">Ajouter au match affiché (${esc(cur.title)})</option>` : ""}</select>

    </div>

    bg.remove(); render(); toast("Import terminé.");
    if (keep && keep.checked){ for (const r of results) if (r.file) { try { await storeFile(r.file, target.id); } catch (e){ toast(`Le fichier n'a pas pu être stocké : ${e.message || e.code}`); } } }
  };
}

          ${ps.indN ? `<div class="box"><h4>Codage indiv · ${ps.indN}</h4><table>${Object.values(ps.ind).sort((a,b) => b.n - a.n).slice(0,14).map(x => `<tr><td>${esc(x.k)}</td><td class="n">${x.n}</td><td class="n">${x.ok + x.ko ? Math.round(x.ok/(x.ok + x.ko)*100) + " %" : ""}</td></tr>`).join("")}</table></div>` : `<div class="box"><h4>Actions</h4><table>${actions.map(([k,v]) => `<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join("") || "<tr><td>Aucune action liée</td></tr>"}</table></div>`}</div>
        <div class="col"><div class="box"><h4>Tirs</h4>${shotMapSVG(m, {onlyUs:true, shots:ps.shots, print:true})}</div>
          ${ps.extra ? `<div class="box"><h4>Données importées</h4><table>${Object.entries(ps.extra).map(([k,v]) => `<tr><td>${esc(k)}</td><td class="n">${Number.isInteger(v)?v:fmt1(v)}</td></tr>`).join("")}</table></div>` : ""}</div>

      </div>${foot}</div>`;
  }
  const rows = duelRows(m, st).slice(0, 16);
  return `<div class="rpt">${head(`<div class="t">Pau FC</div><div class="m">${m.venue === "ext" ? "Extérieur" : "Domicile"}</div>`,
    `<div class="sc">${st.us.goals} – ${st.them.goals}</div><div class="sx">${m.shots.length ? `xG ${fmt1(st.us.xg)} – ${fmt1(st.them.xg)}` : esc(when)}</div>`,
    `<div class="t" style="color:${lum(opp) < .05 ? '#ffffff' : opp}">${esc(m.opponent || "Adversaire")}</div><div class="m">${esc(when)}</div>`)}
    <div class="rb">
      <div class="col"><div class="box"><h4>Comparatif</h4>${rows.map(r => d(r[0], r[1], r[2], r[3])).join("")}</div></div>
